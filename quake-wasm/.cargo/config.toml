# The browser builds use WebAssembly's 128-bit SIMD.
#
# Nothing in the source asks for it: the flag lets the compiler vectorize
# what it can, and what it finds is `D_DrawZSpans`, the 16-bit 1/z written
# for every world pixel (edge.rs, `WorldDraw::draw_band`): eight pixels a
# store. A 2640x1080 frame of demo1 is 7.7% faster for it on one thread at
# span 8, 9.1% at 16, 5.4% at exact (in V8), and 2-4% on eight threads in
# the page (PERF_PLAN.md, §15). Integer lanes only, so every pixel is the
# same with it.
#
# The cost is the browsers that cannot compile such a module: those before
# Chrome 91, Firefox 89 and Safari 16.4 (March 2023). The page asks first
# (web/wasi.js, `SIMD_PROBE`) and says plainly that the game needs it
# (web/PLATFORM.md, "What the browser must give").
#
# Cargo reads this file when it is run from this directory, as the README,
# web/publish.sh and ci/local.sh run it; build.rs warns when a wasm build
# comes without the feature (run from elsewhere, or RUSTFLAGS set, which
# replaces these).
[target.wasm32-wasip1]
rustflags = ["-C", "target-feature=+simd128"]

[target.wasm32-wasip1-threads]
rustflags = ["-C", "target-feature=+simd128"]
