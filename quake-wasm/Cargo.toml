[package]
name = "quake-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser (WASI) shell for quake-rs: the game as a program the page hosts in a Web Worker"
license = "GPL-2.0-or-later"

# A plain program: `fn main()`, stdin/stdout and std::fs. Built for
# `wasm32-wasip1`, it runs in `web/wasi.js`, a small WASI host in a Web Worker
# (web/PLATFORM.md); built natively, the same program runs on a pipe.
[[bin]]
name = "quake"
path = "src/main.rs"

# The engine, unchanged.
[dependencies]
quake-rs = { path = "../quake-rs" }

[features]
# Opt-in per-phase frame timers for `web/bench.py` (see src/bench.rs): each
# frame's phase times ride out on the protocol's BENCH message. Off by
# default: zero code.
bench = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
