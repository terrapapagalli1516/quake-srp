# The edit: every decision that turns the shots, the narration, the score and the sound into the film.
#
#   uv run film/pipeline/edit/timeline.py --dry                    # the clock: where every shot and line falls
#   uv run film/pipeline/edit/build.py --publish cut               # the film (this takes minutes)
#
# timeline.py lays this over the narration (paths.lines: each voice clip and its word times; script.md for each
# line's section) and the media under FILM_ROOT (each footage file's length and sidecar), and writes
# edit/v7/timeline.json, the edit decision list build.py renders. Paths are FILM_ROOT's, except paths.script,
# which is beside this file.
#
# It is the production's edit configs resolved into one file: a base config, four layers of settings for
# shots reused from earlier cuts, and a chain of versions each overriding the one before. Times are seconds,
# on the film's clock (60 fps, 48 kHz). A reference such as "S27~all#1" is a word in a shot's narration (the
# first "all"); "TQ1@in+0.3" is 0.3 s after a shot's cut; "word$" is a word's end.
#
# [[shotlist_sections]] and [[shotlist]] are the shot list, in the order it was planned (section 4.10 moves after HERO:
# paths.move). planned_start and planned_len are the plan's; the narration's clock rules. [shots.ID] is each
# shot's settings: `over` (the narration line it is cut on), `source` and `in` (its footage and in-point),
# `overlays` (cards, labels, captions, diagrams), `switches` (a cut within the shot), sound levels, dips and
# mutes, and `len` for a shot without narration.

[paths]
format = "v3"
script = "script.md"
lines = "voice/v7-lines.json"
out = "edit/v7"
move = { section = "4.10", after = "HERO" }

[clock]
fps = 60
sample_rate = 48000
lead_max = 0.3
voice_after_silent = 0.2
voice_head = 0.04
voice_tail = 0.15

[levels]
voice_clip_lufs = -16.0
voice_plr = 15.0
music_db = -2.0
balance_lu = 12.0
duck_min_db = 4.0
duck_max_db = 20.0
duck_attack = 0.12
duck_release = 0.4
duck_hold = 0.7
duck_bridge = 1.2
duck_hit_window = 0.6
duck_ride = 1.0
voice_presence_db = 2.0
voice_level_range_db = 3.0
game_lufs = -30.0
game_duck_db = 6.0
sfx_db = -8.0
sfx_duck_db = 6.0
master_lufs = -14.0
master_tp = -1.0
limiter_ceiling = -1.6
aac_kbps = 320
sfx_switch_lights_only = true
sfx_free = ["HERO@in"]

[footage]
globs = [
  "footage/game/{id}.mp4",
  "footage/game/{id}.v1.mp4",
  "footage/{id}.mp4",
  "footage/**/{id}.mp4",
  "footage/**/{id}-*.mp4",
  "footage/**/{id}.mov",
]
diagram_glob = "diagrams/final/{d}-*.mp4"
head_by_dir = { "footage/game" = 1.0, "edit/v4/art" = 1.0 }

[voice]
split = { V3-38 = { at = 4.7 } }
gain = { V4-47 = -3.5 }

[pauses]
