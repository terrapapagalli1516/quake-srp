  { path = "music/score-v10.wav", clock = "edit/v7/clock-score.json" },
]
conform_xfade = 0.25
reference = { section = "4.12", lufs = -15.0 }
soft_stops = ["LAB9@in", "LAB10h@in", "S60@in"]

[sfx]
glob = "sound/sfx-v*.wav"
clock_must_match = "edit/v7/timeline.json"

