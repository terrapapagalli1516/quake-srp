<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>quake-rs · Quake in safe-Rust WebAssembly</title>
<style>
  html,body { margin:0; height:100%; background:#0c0c10; color:#cfcfd6;
    font-family:ui-monospace,Menlo,monospace; text-align:center; }
  h3 { margin:10px 0 4px; font-weight:600; }
  #status { min-height:1.1em; color:#8a8; font-size:13px; }
  #wrap { position:relative; display:inline-block; margin-top:8px; }
  canvas { image-rendering:pixelated; width:768px; height:480px; background:#000;
    border:1px solid #333; display:block; cursor:crosshair; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); color:#eee; font-size:18px; cursor:pointer; user-select:none; }
  #overlay.hidden { display:none; }
  .hint { margin:10px; color:#777; font-size:13px; }
  button { font:inherit; background:#222; color:#ccc; border:1px solid #444; padding:4px 10px; cursor:pointer; }
  /* In fullscreen, let the canvas fill the screen (pixel-upscaled). */
  #wrap:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  #wrap:fullscreen canvas { width:auto; height:100vh; }
</style>
</head>
<body>
  <h3>quake-rs — Quake <code>e1m1</code> in WebAssembly</h3>
  <div id="status">loading…</div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="overlay">click to play &nbsp;·&nbsp; mouse = look, WASD = move</div>
  </div>
  <div class="hint">
    <button id="walkBtn">🚶 walk e1m1</button> &nbsp; <button id="demoBtn">▶ play demo1 (e1m3)</button>
    &nbsp; <button id="fs">⛶ fullscreen (F)</button> &nbsp; <button id="sndBtn">🔊 sound (Space)</button><br>
    <b>W A S D</b> move/strafe &nbsp;·&nbsp; <b>mouse</b> look (click to lock; or click-drag) &nbsp;·&nbsp; <b>← →</b> turn<br>
    dependency-free, <code>#![forbid(unsafe_code)]</code> Rust engine compiled to WASM
  </div>
<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('c');
const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const fsBtn = document.getElementById('fs');
const keys = {};
const MOVE_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '];

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'f') toggleFullscreen();
  if (k === ' ') playSound();
  if (MOVE_KEYS.includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else wrap.requestFullscreen?.();
}
fsBtn.addEventListener('click', toggleFullscreen);

document.getElementById('walkBtn').addEventListener('click', () => {
  if (!exp) return;
  exp.boot();
  statusEl.textContent = 'walking e1m1 — click to lock the mouse, WASD to move';
});
document.getElementById('demoBtn').addEventListener('click', () => {
  if (!exp) return;
  statusEl.textContent = 'loading demo1 (e1m3)…';
  setTimeout(() => {
    exp.boot_demo();
    statusEl.textContent = "playing demo1 — id's recorded e1m3 run";
  }, 30);
});

// Decode a real Quake .wav (from the pak, via WASM) and play it with Web Audio.
let audioCtx = null;
async function playSound() {
  if (!exp || !exp.load_sound) return;
  const len = exp.load_sound();
  if (len <= 0) { statusEl.textContent = 'no sound data in pak'; return; }
  const ptr = exp.sound_ptr();
  const bytes = new Uint8Array(exp.memory.buffer, ptr, len).slice(); // copy out
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const buf = await audioCtx.decodeAudioData(bytes.buffer);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination); src.start();
    statusEl.textContent = `played Quake SFX — ${buf.duration.toFixed(2)}s @ ${buf.sampleRate}Hz`;
  } catch (e) { statusEl.textContent = 'sound decode failed: ' + e; }
}
document.getElementById('sndBtn').addEventListener('click', playSound);

// Spatialize a queued sound the way Quake's SND_Spatialize does: fall off with
// distance, pan left/right by where the source sits relative to where the
// listener faces. Returns {gain, pan} in [0,1] / [-1,1], or null if we lack the
// exports to do it (caller then plays flat).
//
//   distance gain = max(0, 1 - dist * attenuation / 1000) * volume
//   pan           = clamp(dot(normalize(source - listener), right), -1, 1)
//
// attenuation 0 => no falloff (full volume everywhere, e.g. some pickups). At
// attenuation 1 a source ~1000 units away is silent; point-blank is full volume.
const ATTEN_SCALE = 1000;
function spatializeSound() {
  // Need the full param + listener export set; otherwise signal "play flat".
  const need = ['sound_origin_x','sound_origin_y','sound_origin_z','sound_volume',
    'sound_attenuation','listener_x','listener_y','listener_z',
    'listener_right_x','listener_right_y','listener_right_z'];
  for (const fn of need) { if (typeof exp[fn] !== 'function') return null; }

  const ox = exp.sound_origin_x(), oy = exp.sound_origin_y(), oz = exp.sound_origin_z();
  let vol = exp.sound_volume();
  const atten = exp.sound_attenuation();
  const lx = exp.listener_x(), ly = exp.listener_y(), lz = exp.listener_z();
  const rx = exp.listener_right_x(), ry = exp.listener_right_y(), rz = exp.listener_right_z();

  // A zero/garbage volume means params weren't populated for this entry — play
  // flat rather than silence a real sound by accident.
  if (!(vol > 0)) vol = 1;

  const dx = ox - lx, dy = oy - ly, dz = oz - lz;
  const dist = Math.hypot(dx, dy, dz);

  let gain = vol;
  if (atten > 0) gain = Math.max(0, 1 - dist * atten / ATTEN_SCALE) * vol;
  // attenuation 0 => audible everywhere at full `vol`.

  let pan = 0;
  if (dist > 1e-3) {
    pan = (dx * rx + dy * ry + dz * rz) / dist;   // dot(normalize(d), right)
    if (pan < -1) pan = -1; else if (pan > 1) pan = 1;
  }
  return { gain, pan };
}

// Play every gameplay sound the server queued this frame. poll_sound() pops one
// WAV into shared memory and returns its length (0 when the queue is empty); we
// copy the bytes out, read its spatial params + the listener pose, and decode/
// play each via Web Audio through a gain (distance) + stereo-pan node graph.
function drainGameSounds() {
  if (!exp || !exp.poll_sound || !audioCtx || audioCtx.state !== 'running') return;
  for (let guard = 0; guard < 16; guard++) {
    const len = exp.poll_sound();
    if (len <= 0) break;
    // Read spatial params right after the pop (poll_sound stashed them for the
    // exports). null => fall back to flat full-volume centered playback.
    const sp = spatializeSound();
    if (sp && sp.gain <= 0.02) continue;          // inaudibly far — don't even decode
    const ptr = exp.sound_ptr();
    const bytes = new Uint8Array(exp.memory.buffer, ptr, len).slice();
    audioCtx.decodeAudioData(bytes.buffer).then(buf => {
      const s = audioCtx.createBufferSource();
      s.buffer = buf;
      playRouted(s, sp);
      s.start();
    }).catch(() => {});
  }
}

// Wire a decoded BufferSource to the destination. With spatial params: source ->
// gain (distance attenuation) -> stereo panner -> destination. If StereoPanner
// isn't available, fall back to an equal-power PannerNode; if neither, just gain.
// With no params (sp == null), play flat (full volume, centered).
function playRouted(src, sp) {
  if (!sp) { src.connect(audioCtx.destination); return; }
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = sp.gain;
  src.connect(gainNode);
  if (typeof audioCtx.createStereoPanner === 'function') {
    const panner = audioCtx.createStereoPanner();
    panner.pan.value = sp.pan;
    gainNode.connect(panner);
    panner.connect(audioCtx.destination);
  } else if (typeof audioCtx.createPanner === 'function') {
    // Older Safari/WebKit: an equal-power PannerNode positioned on the X axis
    // approximates left/right panning (listener at origin facing -Z).
    const panner = audioCtx.createPanner();
    panner.panningModel = 'equalpower';
    if (panner.positionX) { panner.positionX.value = sp.pan; panner.positionZ.value = -1; }
    else if (panner.setPosition) { panner.setPosition(sp.pan, 0, -1); }
    gainNode.connect(panner);
    panner.connect(audioCtx.destination);
  } else {
    gainNode.connect(audioCtx.destination);       // no panner at all — gain only
  }
}

let started = false, exp = null, dragging = false;
const LOOK_SENS = 0.16;   // degrees per mouse-count
const TURN_RATE = 150;    // arrow-key turn deg/sec

function locked() { return document.pointerLockElement === canvas; }

canvas.addEventListener('mousedown', (e) => {
  // First click captures the mouse and starts audio (a required user gesture);
  // subsequent left-clicks while locked fire the weapon.
  if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (!locked()) { canvas.requestPointerLock?.(); }
  else if (e.button === 0 && exp && exp.set_attack) { exp.set_attack(1); }  // fire while locked
  dragging = true;
});
addEventListener('mouseup', (e) => {
  dragging = false;
  if (e.button === 0 && exp && exp.set_attack) exp.set_attack(0);
});
document.addEventListener('pointerlockchange', () => {
  overlay.classList.toggle('hidden', locked());
});
overlay.addEventListener('click', () => canvas.requestPointerLock?.());

canvas.addEventListener('mousemove', e => {
  if (!exp) return;
  if (locked() || dragging) {
    // movementX/Y is the per-event delta. Mouse-right turns right (yaw down);
    // mouse-up looks up (non-inverted).
    exp.look(-e.movementX * LOOK_SENS, e.movementY * LOOK_SENS);
  }
});

async function main() {
  const resp = await fetch('quake_wasm.wasm');
  const bytes = await resp.arrayBuffer();
  statusEl.textContent = 'instantiating ' + (bytes.byteLength/1048576|0) + ' MB WebAssembly…';
  const { instance } = await WebAssembly.instantiate(bytes, {});
  exp = instance.exports;

  statusEl.textContent = 'booting: parsing pak0.pak, loading e1m1, spawning entities…';
  await new Promise(r => setTimeout(r, 30));
  if (!exp.boot()) { statusEl.textContent = 'boot() failed'; return; }

  const W = exp.width(), H = exp.height();
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  statusEl.textContent = 'ready — click to play';

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const fwd  = (keys['w']||keys['arrowup']   ? 1 : 0) - (keys['s']||keys['arrowdown'] ? 1 : 0);
    const side = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    const turn = (keys['arrowright'] ? 1 : 0) - (keys['arrowleft'] ? 1 : 0);
    exp.set_move(fwd, side);
    if (turn) exp.look(-turn * TURN_RATE * dt, 0);   // arrow turn (right = right)
    exp.step(dt);
    drainGameSounds();

    const ptr = exp.framebuffer();
    const mem = new Uint8Array(exp.memory.buffer, ptr, W * H * 4); // re-view (memory may grow)
    img.data.set(mem);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main().catch(e => { statusEl.textContent = 'error: ' + e; console.error(e); });
</script>
</body>
</html>
