<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>quake-rs · Quake in safe-Rust WebAssembly</title>
<style>
  html,body { margin:0; height:100%; background:#0c0c10; color:#cfcfd6;
    font-family:ui-monospace,Menlo,monospace; text-align:center; }
  h3 { margin:10px 0 4px; font-weight:600; }
  #status { min-height:1.1em; color:#8a8; font-size:13px; }
  #wrap { position:relative; display:inline-block; margin-top:8px; }
  canvas { image-rendering:pixelated; width:768px; height:480px; background:#000;
    border:1px solid #333; display:block; cursor:crosshair; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55); color:#eee; font-size:18px; cursor:pointer; user-select:none; }
  #overlay.hidden { display:none; }
  .hint { margin:10px; color:#777; font-size:13px; }
  button { font:inherit; background:#222; color:#ccc; border:1px solid #444; padding:4px 10px; cursor:pointer; }
  /* In fullscreen, let the canvas fill the screen (pixel-upscaled). */
  #wrap:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; background:#000; }
  #wrap:fullscreen canvas { width:auto; height:100vh; }
</style>
</head>
<body>
  <h3>quake-rs — Quake <code>e1m1</code> in WebAssembly</h3>
  <div id="status">loading…</div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="overlay">click to play &nbsp;·&nbsp; mouse = look, WASD = move</div>
  </div>
  <div class="hint">
    <button id="walkBtn">🚶 walk e1m1</button> &nbsp; <button id="demoBtn">▶ play demo1 (e1m3)</button>
    &nbsp; <button id="fs">⛶ fullscreen (F)</button> &nbsp; <button id="sndBtn">🔊 sound (Space)</button><br>
    <b>W A S D</b> move/strafe &nbsp;·&nbsp; <b>mouse</b> look (click to lock; or click-drag) &nbsp;·&nbsp; <b>← →</b> turn<br>
    dependency-free, <code>#![forbid(unsafe_code)]</code> Rust engine compiled to WASM
  </div>
<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('c');
const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const fsBtn = document.getElementById('fs');
const keys = {};
const MOVE_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '];

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'f') toggleFullscreen();
  if (k === ' ') playSound();
  if (MOVE_KEYS.includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else wrap.requestFullscreen?.();
}
fsBtn.addEventListener('click', toggleFullscreen);

document.getElementById('walkBtn').addEventListener('click', () => {
  if (!exp) return;
  exp.boot();
  statusEl.textContent = 'walking e1m1 — click to lock the mouse, WASD to move';
});
document.getElementById('demoBtn').addEventListener('click', () => {
  if (!exp) return;
  statusEl.textContent = 'loading demo1 (e1m3)…';
  setTimeout(() => {
    exp.boot_demo();
    statusEl.textContent = "playing demo1 — id's recorded e1m3 run";
  }, 30);
});

// Decode a real Quake .wav (from the pak, via WASM) and play it with Web Audio.
let audioCtx = null;
async function playSound() {
  if (!exp || !exp.load_sound) return;
  const len = exp.load_sound();
  if (len <= 0) { statusEl.textContent = 'no sound data in pak'; return; }
  const ptr = exp.sound_ptr();
  const bytes = new Uint8Array(exp.memory.buffer, ptr, len).slice(); // copy out
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const buf = await audioCtx.decodeAudioData(bytes.buffer);
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(audioCtx.destination); src.start();
    statusEl.textContent = `played Quake SFX — ${buf.duration.toFixed(2)}s @ ${buf.sampleRate}Hz`;
  } catch (e) { statusEl.textContent = 'sound decode failed: ' + e; }
}
document.getElementById('sndBtn').addEventListener('click', playSound);

let started = false, exp = null, dragging = false;
const LOOK_SENS = 0.16;   // degrees per mouse-count
const TURN_RATE = 150;    // arrow-key turn deg/sec

function locked() { return document.pointerLockElement === canvas; }

canvas.addEventListener('mousedown', () => {
  if (!locked()) canvas.requestPointerLock?.();
  dragging = true;
});
addEventListener('mouseup', () => { dragging = false; });
document.addEventListener('pointerlockchange', () => {
  overlay.classList.toggle('hidden', locked());
});
overlay.addEventListener('click', () => canvas.requestPointerLock?.());

canvas.addEventListener('mousemove', e => {
  if (!exp) return;
  if (locked() || dragging) {
    // movementX/Y is the per-event delta. Mouse-right turns right (yaw down).
    exp.look(-e.movementX * LOOK_SENS, -e.movementY * LOOK_SENS);
  }
});

async function main() {
  const resp = await fetch('quake_wasm.wasm');
  const bytes = await resp.arrayBuffer();
  statusEl.textContent = 'instantiating ' + (bytes.byteLength/1048576|0) + ' MB WebAssembly…';
  const { instance } = await WebAssembly.instantiate(bytes, {});
  exp = instance.exports;

  statusEl.textContent = 'booting: parsing pak0.pak, loading e1m1, spawning entities…';
  await new Promise(r => setTimeout(r, 30));
  if (!exp.boot()) { statusEl.textContent = 'boot() failed'; return; }

  const W = exp.width(), H = exp.height();
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(W, H);
  statusEl.textContent = 'ready — click to play';

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const fwd  = (keys['w']||keys['arrowup']   ? 1 : 0) - (keys['s']||keys['arrowdown'] ? 1 : 0);
    const side = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    const turn = (keys['arrowright'] ? 1 : 0) - (keys['arrowleft'] ? 1 : 0);
    exp.set_move(fwd, side);
    if (turn) exp.look(-turn * TURN_RATE * dt, 0);   // arrow turn (right = right)
    exp.step(dt);

    const ptr = exp.framebuffer();
    const mem = new Uint8Array(exp.memory.buffer, ptr, W * H * 4); // re-view (memory may grow)
    img.data.set(mem);
    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main().catch(e => { statusEl.textContent = 'error: ' + e; console.error(e); });
</script>
</body>
</html>
